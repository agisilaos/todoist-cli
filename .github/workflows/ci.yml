name: ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.22.x"
          - os: macos-latest
            go: "1.26.x"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Ordinary validation
        run: make check
      - name: PowerShell completion smoke test
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/test-powershell-completion.ps1
