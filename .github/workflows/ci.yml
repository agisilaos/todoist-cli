name: ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.27.1"
          - os: macos-latest
            go: "1.27.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Ordinary validation
        run: make check
      - name: Isolated native credential store
        if: runner.os == 'macOS'
        run: TODOIST_TEST_KEYCHAIN=1 go test -tags credentialintegration ./internal/credentials -run '^TestIsolatedKeychain$' -count=1 -timeout 30s
      - name: PowerShell completion smoke test
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/test-powershell-completion.ps1
