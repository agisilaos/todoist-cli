name: release-check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  release-check:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Go 1.22 binaries lack LC_UUID and abort on macOS 26 runners.
          # The Linux CI job retains Go 1.22 compatibility coverage.
          go-version: "1.26.x"

      # Intentionally no extra dependency install step (brew/apt).
      # release-check scripts must rely on stock runner tooling.
      - name: Run release check
        run: make release-check VERSION=v0.0.0
